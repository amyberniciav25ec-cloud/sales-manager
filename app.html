<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Manager Dashboard - MIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Marketing Information System</h1>
    <p class="text-sm">Sales Manager Dashboard</p>
  </header>

  <!-- Main Container -->
  <main class="p-6">
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <h2 class="text-xl font-semibold mb-4">Sales Records</h2>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-200">
          <thead class="bg-gray-200">
            <tr>
              <th class="px-4 py-2 border">Order ID</th>
              <th class="px-4 py-2 border">Customer Name</th>
              <th class="px-4 py-2 border">Product</th>
              <th class="px-4 py-2 border">Amount (₹)</th>
              <th class="px-4 py-2 border">Status</th>
            </tr>
          </thead>
          <tbody class="text-center">
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 border">ORD001</td>
              <td class="px-4 py-2 border">Rahul</td>
              <td class="px-4 py-2 border">Laptop</td>
              <td class="px-4 py-2 border">55000</td>
              <td class="px-4 py-2 border text-green-600 font-semibold">Completed</td>
            </tr>
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 border">ORD002</td>
              <td class="px-4 py-2 border">Anitha</td>
              <td class="px-4 py-2 border">Mobile</td>
              <td class="px-4 py-2 border">22000</td>
              <td class="px-4 py-2 border text-yellow-600 font-semibold">Pending</td>
            </tr>
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 border">ORD003</td>
              <td class="px-4 py-2 border">Karthik</td>
              <td class="px-4 py-2 border">Headset</td>
              <td class="px-4 py-2 border">3000</td>
              <td class="px-4 py-2 border text-red-600 font-semibold">Cancelled</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Actions -->
      <div class="mt-6 flex gap-4">
        <button class="bg-blue-600 text-white px-4 py-2 rounded-xl shadow hover:bg-blue-700">Add Sale</button>
        <button class="bg-green-600 text-white px-4 py-2 rounded-xl shadow hover:bg-green-700">Export</button>
      </div>
    </div>
  </main>

</body>
</html>
